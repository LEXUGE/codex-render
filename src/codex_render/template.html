<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>${title}</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #ffffff;
      --foreground: #1f2328;
      --muted: #59636e;
      --border: #d1d9e0;
      --surface: #f6f8fa;
      --link: #0969da;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0d1117;
        --foreground: #f0f6fc;
        --muted: #9198a1;
        --border: #3d444d;
        --surface: #151b23;
        --link: #4493f8;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--foreground);
      font: 16px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100% - 2rem, 860px);
      margin: 0 auto;
      padding: 2.5rem 0 5rem;
    }

    .thread-header {
      margin-bottom: 2rem;
      color: var(--muted);
      font-size: 0.875rem;
      overflow-wrap: anywhere;
    }

    .message {
      padding: 0 0 2.5rem;
      margin: 0 0 2.5rem;
      border-bottom: 1px solid var(--border);
    }

    .message-label {
      margin-bottom: 1rem;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .message-label span {
      margin-left: 0.5rem;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3 { line-height: 1.25; }
    .markdown-body h1 { font-size: 1.8rem; }
    .markdown-body h2 { margin-top: 2rem; font-size: 1.4rem; }
    .markdown-body h3 { margin-top: 1.5rem; font-size: 1.15rem; }
    .markdown-body a { color: var(--link); }
    .markdown-body img { max-width: 100%; }
    .markdown-body blockquote {
      margin-left: 0;
      padding-left: 1rem;
      border-left: 0.25rem solid var(--border);
      color: var(--muted);
    }

    .markdown-body code {
      padding: 0.15em 0.35em;
      border-radius: 0.3rem;
      background: var(--surface);
      font: 0.875em/1.45 ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .markdown-body .highlight {
      margin: 1rem 0;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      background: #0d1117;
    }

    .markdown-body .highlight pre { margin: 0; padding: 1rem; }
    .markdown-body .highlight code { padding: 0; background: transparent; }

    .markdown-body table {
      display: block;
      max-width: 100%;
      overflow-x: auto;
      border-collapse: collapse;
    }

    .markdown-body th,
    .markdown-body td { padding: 0.45rem 0.75rem; border: 1px solid var(--border); }
    .markdown-body th { background: var(--surface); }
    .task-list-item { list-style: none; }
    .task-list-item input { margin: 0 0.45rem 0 -1.35rem; }
    .arithmatex { overflow-x: auto; overflow-y: hidden; }

${pygments_css}
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["\\(", "\\)"]],
        displayMath: [["\\[", "\\]"]],
        processEscapes: true,
        processEnvironments: true
      },
      options: {
        ignoreHtmlClass: ".*",
        processHtmlClass: "arithmatex"
      },
      svg: { fontCache: "global" }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4.0.0/tex-svg.js"></script>
</head>
<body>
  <main>
    <header class="thread-header">Codex thread ${session_id}</header>
    <!-- CODEX_RENDER_MESSAGES -->
  </main>
</body>
</html>

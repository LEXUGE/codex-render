[project]
name = "codex-render"
version = "0.1.0"
description = "Render Codex Stop hook messages as static HTML"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "markdown>=3.8,<4",
    "nh3>=0.3,<0.4",
    "pygments>=2.19,<3",
    "pymdown-extensions>=10.16,<11",
]

[project.scripts]
codex-render = "codex_render.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_render"]

[tool.hatch.build.targets.sdist]
include = ["src/codex_render", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

